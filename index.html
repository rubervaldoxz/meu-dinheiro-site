<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Início · Meu Dinheiro</title>
<style>
:root{--bg:#f7f8fa;--fg:#1b2330;--muted:#556070;--line:#d9dee6;--accent:#0f766e;--mark-bg:#fde68a;--mark-fg:#3b2f00}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6e9ef;--muted:#9aa5b4;--line:#263040;--accent:#34d399}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;font-size:1.0625rem;line-height:1.75}
.wrap{max-width:68ch;margin:0 auto;padding:1.25rem 1.25rem 4rem}
header.top{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:2rem}
header.top .brand{font-weight:700;font-size:1.05rem;color:var(--fg);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;font-size:.95rem}
a{color:var(--accent);text-underline-offset:.18em}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1{font-size:clamp(1.75rem,5vw,2.3rem);line-height:1.2;margin:0 0 .4rem}
h2{font-size:1.25rem;line-height:1.3;margin:2.4rem 0 .5rem}
p,ul,ol{margin:.7rem 0}
li{margin:.35rem 0}
.meta{color:var(--muted);font-size:.95rem;margin-bottom:1.6rem}
mark{background:var(--mark-bg);color:var(--mark-fg);padding:0 .25em;border-radius:3px}
footer{margin-top:3.5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.list-links{list-style:none;padding:0;margin:1.5rem 0}
.list-links li{margin:.6rem 0;font-size:1.1rem}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="brand" href="index.html">Meu Dinheiro</a></header>
<main>
<h1>Meu Dinheiro</h1>
<p class="meta">Controle financeiro pessoal: entradas, saídas, parcelas, lançamentos fixos e metas.</p>
<ul class="list-links">
<li><a href="privacidade.html">Política de Privacidade</a></li>
<li><a href="termos.html">Termos de Uso</a></li>
<li><a href="excluir-conta.html">Excluir conta e dados</a></li>
</ul>
</main>
<footer>Contato: [[suporte.rssantos@gmail.com]]</footer>
</div>
</body>
</html>
